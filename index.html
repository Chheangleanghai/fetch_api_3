<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Store</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin: 35px 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    #loading {
      text-align: center;
      font-size: 18px;
      margin-top: 50px;
    }

    #products {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding-bottom: 50px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
    }

    .image-box {
      position: relative;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .new {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #111;
      color: white;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 10px;
    }

    .content {
      padding: 12px;
    }

    .brand {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card h3 {
      font-size: 17px;
      margin: 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category {
      color: #777;
      font-size: 12px;
      margin: 4px 0;
      text-transform: capitalize;
    }

    .description {
      color: #666;
      font-size: 12px;
      line-height: 1.4;
      margin: 6px 0;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rating {
      color: #f5a623;
      font-size: 13px;
      margin: 7px 0;
    }

    .price-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 7px 0 10px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
    }

    .old-price {
      font-size: 12px;
      color: #999;
      text-decoration: line-through;
    }

    button {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #333;
    }
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin: 20px 0 50px;
    }

        .pagination button {
        width: auto;
        padding: 10px 18px;
    }

        .pagination button:disabled {
        background: #ccc;
        cursor: not-allowed;
    }

    @media (max-width: 1000px) {
      #products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 750px) {
      #products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      #products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
    <h1>Our Products</h1>
    <p class="subtitle">Explore our latest collection</p>
    <p id="loading">Loading products...</p>
    <div id="products"></div>
    <div class="pagination">
        <button id="prev">Previous</button>
        <span id="pageNumber"></span>
        <button id="next">Next</button>
    </div>

  <script>
const url = "https://fakestoreapi.noksha.dev/api/products";

const productsBox = document.getElementById("products");
const loading = document.getElementById("loading");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const pageNumber = document.getElementById("pageNumber");

let currentPage = 1;
let totalPages = 1;

async function getProducts(page = 1) {
  try {
    loading.style.display = "block";
    productsBox.innerHTML = "";

    const response = await fetch(`${url}?page=${page}`);
    const result = await response.json();

    currentPage = result.currentPage;
    totalPages = result.totalPages;

    loading.style.display = "none";
    showProducts(result.data);

    pageNumber.innerText = `Page ${currentPage} of ${totalPages}`;
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
  } catch (error) {
    loading.innerText = "Failed to load products";
    console.log(error);
  }
}

function showProducts(products) {
  products.forEach(product => {
    productsBox.innerHTML += `
      <div class="card">
        <div class="image-box">
          <img src="${product.image}" alt="${product.title}">
          ${product.isNew ? `<span class="new">NEW</span>` : ""}
        </div>
        <div class="content">
          <div class="brand">${product.brand}</div>
          <h3>${product.title}</h3>
          <p class="category">${product.category} • ${product.type}</p>
          <p class="description">${product.description}</p>
          <div class="rating">⭐ ${product.rating} / 5</div>
          <div class="price-box">
            <span class="price">$${product.discountedPrice}</span>
            <span class="old-price">$${product.oldPrice}</span>
          </div>
          <button>Add to Cart</button>
        </div>
      </div>
    `;
  });
}

prevBtn.addEventListener("click", () => {
  if (currentPage > 1) {
    getProducts(currentPage - 1);
  }
});

nextBtn.addEventListener("click", () => {
  if (currentPage < totalPages) {
    getProducts(currentPage + 1);
  }
});

getProducts();
  </script>
</body>
</html>
